# Nginx : sert la PWA (fichiers statiques) et relaie l'API + le WebSocket
# Socket.IO vers le conteneur `server`. Le TLS et le domaine sont gérés en amont
# par Nginx Proxy Manager (NPM), qui pointe vers ce conteneur.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# API REST
	location /api/ {
		# Upload d'images produit. Sans cette directive nginx plafonne le corps
		# des requetes a 1 Mo par defaut et renvoie un 413 AVANT que la requete
		# n'atteigne Fastify : un SVG de quelques ko passe, une photo prise a
		# l'iPad non. Doit rester >= MAX_UPLOAD_BYTES cote serveur.
		client_max_body_size 32m;

		proxy_pass http://server:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# WebSocket Socket.IO (upgrade requis)
	location /socket.io/ {
		proxy_pass http://server:3001;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 3600s;
	}

	# Le service worker ne doit pas être mis en cache agressivement.
	location = /sw.js {
		add_header Cache-Control "no-cache";
	}

	# SPA : tout le reste retombe sur index.html (routing côté client).
	location / {
		try_files $uri $uri/ /index.html;
	}
}
